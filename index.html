<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiniela Güsak</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #F4F0E3;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #80785C;
    }

    .tabla-contenedor {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .tabla-fija {
      flex-shrink: 0;
      background-color: #1a1a1a;
      border-right: 2px solid #333;
      border-radius: 12px 0 0 12px;
    }

    .tabla-scroll {
      overflow-x: auto;
      background-color: #1a1a1a;
      border-radius: 0 12px 12px 0;
    }

    table {
      border-collapse: collapse;
      font-size: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }

    thead th {
      background: linear-gradient(180deg, #4E4938, #3b3629);
      color: #F4F0E3;
      font-weight: 600;
    }

    /* Bordes redondeados superiores */
    .tabla-fija thead th:first-child {
      border-top-left-radius: 12px;
    }
    .tabla-scroll thead th:last-child {
      border-top-right-radius: 12px;
    }

    /* Hover en filas */
    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    td.total {
      font-weight: bold;
      font-family: Consolas, monospace;
      text-align: center;
    }

    td.posicion {
      text-align: center;
      font-weight: bold;
    }

    td.nombre {
      text-align: left;
    }

    /* Top 4 */
    tr.top td {
      color: #50fa50;
    }

    /* Bottom 4 */
    tr.bottom td {
      color: #ff4c43;
    }

    @media (max-width: 600px) {
      table {
        font-size: 13px;
      }
      th, td {
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <h1>Quiniela Güsak</h1>

  <div class="tabla-contenedor">
    <!-- Tabla fija -->
    <div class="tabla-fija">
      <table>
        <thead id="cabecera-fija"></thead>
        <tbody id="datos-fija"></tbody>
      </table>
    </div>

    <!-- Tabla desplazable -->
    <div class="tabla-scroll">
      <table>
        <thead id="cabecera-scroll"></thead>
        <tbody id="datos-scroll"></tbody>
      </table>
    </div>
  </div>

  <script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-IvFFGYOHR_OxkUBqUIReu9vSb3CJq5B31jH2vGU1zAQ68BqB1FIJRCPXpWMML41GLbxPxoPzKekP/pub?gid=1550608994&single=true&output=csv";

    fetch(urlCSV)
      .then(res => res.text())
      .then(data => {
        const rows = data.trim().split("\n");
        const headers = rows[0].split(",");
        const bodyRows = rows.slice(1);

        const cabFija = document.getElementById("cabecera-fija");
        const cabScroll = document.getElementById("cabecera-scroll");
        const datFija = document.getElementById("datos-fija");
        const datScroll = document.getElementById("datos-scroll");

        // Cabeceras
        cabFija.innerHTML = `<tr><th>#</th><th>Jugador</th><th>Pts</th></tr>`;
        cabScroll.innerHTML = `<tr>${headers.slice(2).map(h => `<th>${h}</th>`).join("")}</tr>`;

        // Datos
        const jugadores = bodyRows.map(fila => {
          const celdas = fila.split(",");
          return {
            nombre: celdas[0],
            puntos: parseInt(celdas[1]) || 0,
            jornadas: celdas.slice(2)
          };
        });

        jugadores.sort((a, b) => b.puntos - a.puntos);

        jugadores.forEach((j, index) => {
          const clase = index < 4 ? "top" : (index >= jugadores.length - 4 ? "bottom" : "");

          datFija.innerHTML += `
            <tr class="${clase}">
              <td class="posicion">${index + 1}</td>
              <td class="nombre">${j.nombre}</td>
              <td class="total">${j.puntos}</td>
            </tr>
          `;

          datScroll.innerHTML += `
            <tr class="${clase}">
              ${j.jornadas.map(val => `<td>${val}</td>`).join("")}
            </tr>
          `;
        });
      });
  </script>
</body>
</html>
